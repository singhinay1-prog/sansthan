 if(g('tch'))g('tch').value=U.name||'';
 if(g('pc'))g('pc').value=cn;
 try{w.CFG.org=D.inst||'';w.CFG.teacher=U.name||'';w.CFG.contact=cn}catch(e){}
 CLS().forEach(c=>{const v=String(c);if(w.CLS0.indexOf(v)<0&&w.CLX.indexOf(v)<0)w.CLX.push(v)});
 w.clDraw(g('cls').value);w.qzEmbed(API,qzKey(),Object.keys(DB.i).find(k=>DB.i[k]==D))}catch(e){}}
function qzIds(){qzOpen();setTimeout(()=>{try{const d=document.getElementById('qzfr').contentWindow.document;d.getElementById('more').open=true;const x=d.querySelector('#more details');if(x){x.open=true;x.scrollIntoView()}}catch(e){}},300)}

/* ===== टेस्ट भेजें: क्लास के बच्चे / अन्य ===== */
let TS={m:'c',c:'',t:'',tn:'',d:'',s:{}};
const qtl=()=>{try{return JSON.parse(localStorage.getItem('qtl')||'[]')}catch(e){return[]}};
function tsName(){const x=qtl().find(q=>q.id==TS.t);return x?x.t:TS.tn}
function tsMsg(n){const t=tsName(),ds=TS.d?' अंतिम तारीख: '+TS.d.split('-').reverse().join('-')+'।':'';return `नमस्ते ${n}, ${D.inst} की ओर से टेस्ट "${t||'नया टेस्ट'}" दिया गया है।${ds} टेस्ट की फाइल खोलकर अपना मोबाइल नंबर लिखें और जवाब दें। शुभकामनाएं 🙏`}
function tsSync(){const g=i=>document.getElementById(i);if(g('tst_t'))TS.t=g('tst_t').value;if(g('tst_n'))TS.tn=g('tst_n').value;if(g('tst_d'))TS.d=g('tst_d').value;if(g('tst_c'))TS.c=g('tst_c').value}
function tsSet(k,v){tsSync();TS[k]=v;tsend()}
function tsRow(n,m,k,x){const t=encodeURIComponent(tsMsg(n));return `<div class="r" style="padding:8px 0;border-bottom:1px solid var(--line);${TS.s[k]?'opacity:.55':''}"><span>${E(n)}<div class="m">${E(m)}${x?' · '+E(x):''}${TS.s[k]?' ✓ भेजा':''}</div></span><span><a class="btn s" target="_blank" href="https://wa.me/91${ph(m)}?text=${t}" onclick="TS.s['${k}']=1">WhatsApp</a> <a class="btn s" href="sms:${ph(m)}?body=${t}" onclick="TS.s['${k}']=1">SMS</a>${x!==undefined&&k[0]=='o'?` <button class="s bad" onclick="tsDel('${k.slice(1)}')">✕</button>`:''}</span></div>`}
function tsend(){const l=qtl().slice().reverse(),cs=CLS();if(TS.t&&!l.some(x=>x.id==TS.t))TS.t='';if(!TS.t&&!TS.tn&&l.length)TS.t=l[0].id;if(!TS.c)TS.c=cs.find(c=>cls(c).length)||cs[0]||'';
 let body;
 if(TS.m=='c'){const st=TS.c?cls(TS.c):[];body=`<label>क्लास</label><select id="tst_c" onchange="tsSet('c',this.value)">${cs.map(c=>`<option ${TS.c==c?'selected':''} value="${E(c)}">क्लास ${E(c)}</option>`).join('')}</select><div class="m" style="margin:6px 0">${st.length} बच्चे · नाम के आगे बटन से सीधे भेजें</div>${st.map(s=>tsRow(s.name,s.mob,'s'+s.id)).join('')||'<div class="m">इस क्लास में कोई बच्चा नहीं</div>'}`}
 else{const xo=D.xo=D.xo||[];body=`<div class="m" style="margin-bottom:6px">जो बच्चे/लोग संस्थान की क्लास में नहीं हैं (नया एडमिशन, दूसरे स्कूल के बच्चे, आदि)</div>${xo.map((x,i)=>tsRow(x.name,x.mob,'o'+i,x.note||'')).join('')}<label>नाम</label><input id="xn"><label>मोबाइल (10 अंक)</label><input id="xm" type="tel" maxlength="10"><label>क्लास / नोट (वैकल्पिक)</label><input id="xt" placeholder="जैसे: क्लास 8, बाहर का"><button class="p b" onclick="tsAdd()">➕ जोड़ें</button><button class="b" onclick="document.getElementById('mo').remove();qzIds()">🆔 बिना मोबाइल वाले के लिए Student ID बनाएं</button>`}
 popup(`<h3>📤 टेस्ट भेजें</h3><div class="r" style="margin-bottom:8px"><button class="${TS.m=='c'?'p':'s'}" onclick="tsSet('m','c')">🏫 क्लास के बच्चे</button><button class="${TS.m=='o'?'p':'s'}" onclick="tsSet('m','o')">👤 अन्य</button></div><label>कौन सा टेस्ट</label><select id="tst_t" onchange="tsSet('t',this.value)"><option value="">— नाम खुद लिखें —</option>${l.map(x=>`<option ${TS.t==x.id?'selected':''} value="${E(x.id)}">${E(x.t)}</option>`).join('')}</select>${TS.t?'':`<input id="tst_n" value="${E(TS.tn)}" placeholder="टेस्ट का नाम" style="margin-top:6px">`}<label>अंतिम तारीख (वैकल्पिक)</label><input id="tst_d" type="date" value="${TS.d}" onchange="tsSync()"><div class="m" style="margin:6px 0">पहले "टेस्ट बनाएं" से फाइल ग्रुप/बच्चों को Send करें, फिर यहाँ से सबको याद दिलाएं।</div>${body}`)}
function tsAdd(){tsSync();const n=V('xn'),m=ph(V('xm'));if(!n||m.length!=10)return toast('नाम और 10 अंक का मोबाइल भरें');(D.xo=D.xo||[]).push({name:n,mob:m,note:V('xt')});save();tsend()}
async function tsDel(i){tsSync();if(await ask('हटाएं?')){D.xo.splice(+i,1);save();tsend()}}
(function(){const o=out;out=function(){qzKill();return o.apply(this,arguments)}})();
</script>
</body></html>
